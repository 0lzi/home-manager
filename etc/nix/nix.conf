experimental-features = nix-command flakes
# auto-allocate-uids lets unprivileged Nix builds get fresh uids;
# enable on multi-user boxes where the nixbld group is shared.
# auto-allocate-uids = true
build-users-group = nixbld
build-dir = /var/tmp/nix-build

# Keep the last GC generations around so accidental `nix-collect-garbage`
# runs are recoverable. Adjust if you want more aggressive cleanup.
# keep-outputs = true
# keep-derivations = true
