set-option -sa terminal-overrides ",xterm*:Tc"

unbind C-b
set -g prefix C-Space

set -g extended-keys on
set -g extended-keys-format csi-u

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Windows/panes start at 1 (baseIndex is set in apps/tmux.nix)
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-window-option -g automatic-rename off

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Plugins (tmux-resurrect, tmux-continuum, catppuccin-tmux, etc.) are
# managed by Home Manager in apps/tmux.nix — no TPM config needed here.

# vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
set -g @yank_selection 'primary'

# Close window
bind -n M-W kill-pane
# MSTerminal split binding
bind -n M-+ split-window -h -c "#{pane_current_path}"
bind -n M-_ split-window -v -c "#{pane_current_path}"

# Alt-Shift Arrow Resize-pane
bind -n S-M-Left resize-pane -L 5
bind -n S-M-Right resize-pane -R 5
bind -n S-M-Up resize-pane -U 5
bind -n S-M-Down resize-pane -D 5

# Alt + Shift T new Window
bind -n M-T new-window

# Restore Clear Screen
bind C-l send-keys 'C-l'

# Show tmux ls
#bind-key -r 0 choose-tree

# Create new sessions in common places (tmux-sessionizer).
# The per-directory binds are generated from a list in apps/tmux.nix.
bind-key -r f run-shell "tmux neww ~/.local/bin/scripts/tmux-sessionizer"

# Sync pane typing
bind -n 'M-s' setw synchronize-panes
